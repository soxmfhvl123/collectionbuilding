<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>웜 디퓨저 패널</title>
<style>
/* Layout: 불 꺼진 방의 어두운 벽, 가운데 벽걸이 정사각 디퓨저 패널 하나와 아래로 늘어진 전원선 */
:root{
  --wall:#0f0d0c;
  --wall-lift:#1b1815;
  --panel-off-hi:#2c2926;
  --panel-off-lo:#1d1b19;
  --cable:#070606;
  --glow:255 150 60;
  color-scheme:dark;
}
html,body{height:100%;margin:0}
body{background:var(--wall);overflow:hidden}

.room{
  position:relative;height:100%;box-sizing:border-box;
  display:grid;place-items:center;
  padding:24px 16px;
  background:radial-gradient(60% 55% at 50% 45%, var(--wall-lift), var(--wall) 80%);
}
/* 벽면 질감 */
.room::after{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.35;mix-blend-mode:overlay;
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.65' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 .7 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}

.mount{position:relative;width:min(420px,72vw,62vh);z-index:1}
/* 패널 빛이 벽에 번지는 부분 */
.spill{
  position:absolute;inset:-90%;pointer-events:none;filter:blur(60px);
  background:radial-gradient(closest-side circle at var(--gx,50%) var(--gy,50%),
    rgb(var(--glow) / var(--ga,.3)) 0%,
    rgb(var(--glow) / calc(var(--ga,.3) * .28)) 38%,
    transparent 100%);
}
.cable{
  position:absolute;left:50%;top:99%;width:3px;height:100vh;transform:translateX(-50%);
  background:linear-gradient(180deg, rgb(var(--glow) / .25), var(--cable) 30px);
  border-radius:2px;
}
.panel{
  position:relative;width:100%;aspect-ratio:1;max-width:100%;overflow:hidden;
  border-radius:3px;touch-action:none;cursor:crosshair;
  box-shadow:
    0 0 0 1px #050404,
    0 2px 0 1px rgb(0 0 0 / .6),
    0 40px 60px -30px rgb(0 0 0 / .9);
}
.panel > *{position:absolute;inset:0;width:100%;height:100%;display:block}
.base{
  background:
    radial-gradient(circle, rgb(0 0 0 / .14) 28%, transparent 33%) 0 0 / calc(100% / 64) calc(100% / 64),
    linear-gradient(180deg, var(--panel-off-hi), var(--panel-off-lo));
}
#glow{filter:blur(var(--blur,40px)) saturate(1.15) brightness(1.35);image-rendering:auto}
.grain{
  pointer-events:none;mix-blend-mode:overlay;opacity:.45;
  background:
    linear-gradient(162deg, rgb(255 255 255 / .08), transparent 35%),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 .6 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
/* 아크릴 단면이 빛을 머금는 테두리 */
.edge{
  pointer-events:none;border-radius:3px;
  box-shadow:inset 0 0 0 1px rgb(var(--glow) / var(--ea,.15)), inset 0 0 12px rgb(var(--glow) / calc(var(--ea,.15) * .5));
}
</style>
</head><body>

<div class="room">
  <div class="mount" id="mount">
    <div class="spill" id="spill"></div>
    <div class="cable"></div>
    <div class="panel" id="panel">
      <div class="base"></div>
      <canvas id="glow" aria-label="벽걸이 웜 LED 디퓨저 패널. 커서를 올리면 빛이 따라옵니다."></canvas>
      <div class="grain"></div>
      <div class="edge" id="edge"></div>
    </div>
  </div>
</div>

<script>
(function(){
  const G = 64;
  const GAP = 20, SIZE = 1, TRAIL = .87, TONE = .15;   // 마지막으로 맞춘 세팅

  const panel = document.getElementById('panel');
  const glow = document.getElementById('glow');
  const spill = document.getElementById('spill');
  const edge = document.getElementById('edge');
  const root = document.documentElement;
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  glow.width = G; glow.height = G;
  const gctx = glow.getContext('2d');
  const img = gctx.createImageData(G, G);
  const F = new Float32Array(G*G);
  const st = { over:false, press:false, tx:.5, ty:.45, x:.5, y:.45, vx:0, vy:0 };

  // 밝기 → 색 (속은 따뜻한 흰빛, 바깥은 주황·붉은빛)
  const AMBER = [[0,[95,28,0]],[.3,[205,85,15]],[.6,[255,155,60]],[.85,[255,210,145]],[1.15,[255,242,220]]];
  const EMBER = [[0,[100,8,4]],[.3,[210,35,12]],[.6,[255,88,30]],[.85,[255,160,100]],[1.15,[255,222,195]]];
  function sample(stops, v){
    if(v <= stops[0][0]) return stops[0][1];
    for(let s=1;s<stops.length;s++){
      if(v <= stops[s][0]){
        const [a,ca] = stops[s-1], [b,cb] = stops[s], t = (v-a)/(b-a);
        return [ca[0]+(cb[0]-ca[0])*t, ca[1]+(cb[1]-ca[1])*t, ca[2]+(cb[2]-ca[2])*t];
      }
    }
    return stops[stops.length-1][1];
  }
  const LUT = new Uint8ClampedArray(256*4);
  for(let k=0;k<256;k++){
    const v = k/255*1.2, a = sample(AMBER,v), b = sample(EMBER,v);
    LUT[k*4]   = a[0]+(b[0]-a[0])*TONE;
    LUT[k*4+1] = a[1]+(b[1]-a[1])*TONE;
    LUT[k*4+2] = a[2]+(b[2]-a[2])*TONE;
    LUT[k*4+3] = 255*Math.min(1, Math.pow(v/.6, .85));
  }
  const mid = Math.round(.62/1.2*255)*4;
  root.style.setProperty('--glow', `${LUT[mid]} ${LUT[mid+1]} ${LUT[mid+2]}`);

  function resize(){
    const W = panel.getBoundingClientRect().width, p = W/G;
    panel.style.setProperty('--blur', (p*(.35 + GAP*.42)).toFixed(1)+'px');
  }
  new ResizeObserver(resize).observe(panel); resize();

  function pos(e){
    const r = panel.getBoundingClientRect();
    st.tx = Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));
    st.ty = Math.max(0,Math.min(1,(e.clientY-r.top)/r.height));
  }
  panel.addEventListener('pointerenter', e => { pos(e); st.over=true; });
  panel.addEventListener('pointermove', e => { pos(e); st.over=true; });
  panel.addEventListener('pointerdown', e => { pos(e); st.over=true; st.press=true; });
  const up = e => { st.press=false; if(e.pointerType!=='mouse') st.over=false; };
  panel.addEventListener('pointerup', up);
  panel.addEventListener('pointercancel', up);
  panel.addEventListener('pointerleave', () => { st.over=false; st.press=false; });

  let press = 0;
  function frame(now){
    if(!st.over && !reduce){
      st.tx = .5 + .24*Math.sin(now*.00031);
      st.ty = .46 + .2*Math.sin(now*.00047 + 1.3);
    } else if(!st.over){ st.tx=.5; st.ty=.45; }

    if(reduce){ st.x=st.tx; st.y=st.ty; }
    else{
      st.vx = (st.vx + (st.tx-st.x)*.065)*.8;
      st.vy = (st.vy + (st.ty-st.y)*.065)*.8;
      st.x += st.vx; st.y += st.vy;
    }
    press += ((st.press?1:0) - press)*(reduce?1:.12);

    const sigma = (2.4 + SIZE*8) * (1 + press*.35);
    const amp = (1 + press*.28) * (reduce ? 1 : 1 + .025*Math.sin(now*.0042));
    const decay = reduce ? 0 : .78 + TRAIL*.19;
    const cx = st.x*G, cy = st.y*G, lim = 9*sigma*sigma, inv = 1/(2*sigma*sigma);
    const d = img.data;
    let sum = 0;
    for(let j=0;j<G;j++){
      const dy = j+.5-cy;
      for(let i=0;i<G;i++){
        const n = j*G+i, dx = i+.5-cx, d2 = dx*dx+dy*dy;
        const t = d2 < lim ? amp*Math.exp(-d2*inv) : 0;
        const v = Math.max(F[n]*decay, t);
        F[n] = v; sum += v;
        const k = Math.min(255, (v/1.2*255)|0)*4, o = n*4;
        d[o]=LUT[k]; d[o+1]=LUT[k+1]; d[o+2]=LUT[k+2]; d[o+3]=LUT[k+3];
      }
    }
    gctx.putImageData(img,0,0);

    const energy = Math.min(1, sum/(sigma*sigma*6));
    spill.style.setProperty('--gx', ((.9+st.x)/2.8*100).toFixed(1)+'%');
    spill.style.setProperty('--gy', ((.9+st.y)/2.8*100).toFixed(1)+'%');
    spill.style.setProperty('--ga', (.22 + energy*.3 + press*.12).toFixed(3));
    edge.style.setProperty('--ea', (.08 + energy*.18 + press*.08).toFixed(3));

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body></html>
